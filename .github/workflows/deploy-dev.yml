name: Deploy backend

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: [self-hosted, yuviron]

    steps:
      - name: Pull repo
        run: |
          cd /opt/yuviron/src/yuviron-backend
          git pull origin dev

      - name: Apply EF Core migrations
        run: |
          docker run --rm \
            --network host \
            -v /opt/yuviron/src/yuviron-backend:/src \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:9.0 \
            bash -lc '
              dotnet tool install --global dotnet-ef || dotnet tool update --global dotnet-ef
              export PATH="$PATH:/root/.dotnet/tools"
              dotnet restore
              dotnet ef database update -p src/Yuviron.Infrastructure -s src/Yuviron.Api
            '

      - name: Rebuild backend
        run: |
          cd /opt/yuviron/infra
          docker compose -f compose.dev.yml up -d --build --force-recreate yuviron-dev-backend