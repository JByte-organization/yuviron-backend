<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0b0413; margin: 0; padding: 0; width: 100% !important; }
        .wrapper { padding: 40px 20px; background-color: #0b0413; }
        .container { max-width: 600px; margin: 0 auto; background-color: #140b24; border: 1px solid #321b54; border-radius: 20px; padding: 40px 30px; box-shadow: 0 10px 30px rgba(116, 45, 230, 0.15); }
        .logo { text-align: center; margin-bottom: 30px; }
        .header { text-align: center; padding-bottom: 10px; }
        .header h1 { color: #ffffff; margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
        .content { text-align: center; padding: 10px 0; color: #b3a7c6; line-height: 1.6; font-size: 16px; }

        .code-box {
            background: rgba(139, 92, 246, 0.1);
            border: 1px dashed #8b5cf6;
            border-radius: 12px;
            display: inline-block;
            padding: 15px 40px;
            margin: 25px 0;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 8px;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2) inset;
        }

        .footer { text-align: center; font-size: 13px; color: #5d4d7a; margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="container">
        <div class="logo">
            <span style="color: #ffffff; font-size: 24px; font-weight: 800; letter-spacing: -1px;">
                <span style="color: #3b82f6;">Y</span>uviron
            </span>
        </div>
        <div class="header">
            <h1>Код авторизації 🎵</h1>
        </div>
        <div class="content">
            <p>Ваш одноразовий код для входу в систему:</p>

            <div class="code-box">
                {{ Code }}
            </div>

            <p style="margin-top: 20px; font-size: 14px;">Код дійсний протягом 10 хвилин. Нікому його не повідомляйте.</p>
        </div>
        <div class="footer">
            <p>Якщо ви не намагалися увійти в систему, негайно проігноруйте цей лист.</p>
            <p>© 2026 Yuviron Team. Всі права захищені.</p>
        </div>
    </div>
</div>
</body>
</html>
